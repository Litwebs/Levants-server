<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/png" href="/logo.png" />

    <style>
      /* Prevent white flash before CSS bundle loads */
      html { background-color: #fafafa; color-scheme: light; }
      html[data-theme="dark"] { background-color: #0f0f11; color-scheme: dark; }
      body { margin: 0; background-color: inherit; }
    </style>

    <script>
      (function () {
        function applyTheme() {
          var theme = "system";
          try {
          var stored = localStorage.getItem("levants:theme");
          theme =
            stored === "light" || stored === "dark" || stored === "system"
              ? stored
              : "system";
          } catch (e) { /* Use the system preference when storage is unavailable. */ }
          var systemDark =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          var isDark = theme === "dark" || (theme === "system" && systemDark);

          var root = document.documentElement;
          root.classList.toggle("dark", isDark);
          root.dataset.theme = isDark ? "dark" : "light";
          root.style.colorScheme = isDark ? "dark" : "light";
          if (document.body) document.body.dataset.theme = root.dataset.theme;
        }
        applyTheme();
        var media = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)");
        if (media && media.addEventListener) media.addEventListener("change", applyTheme);
      })();
    </script>
    <title>Levants Admin</title>
    <meta name="description" content="Lovable Generated Project" />
    <meta name="author" content="Lovable" />

    <!-- TODO: Update og:title to match your application name -->
    <meta property="og:title" content="Levants Admin" />
    <meta property="og:description" content="Lovable Generated Project" />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@Lovable" />
    <!-- <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" /> -->
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
