# Install only after DNS, certificate and UAT access credentials are ready.
server {
    listen 80;
    server_name uat-api.levantsdairy.co.uk;
    location /.well-known/acme-challenge/ {
        root /var/lib/levants-uat-acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name uat-api.levantsdairy.co.uk;
    ssl_certificate /etc/letsencrypt/live/uat-api.levantsdairy.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uat-api.levantsdairy.co.uk/privkey.pem;
    auth_basic "Levants UAT";
    auth_basic_user_file /etc/levants-uat/nginx.htpasswd;
    client_max_body_size 10m;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Levants-Environment "uat" always;
    location / {
        proxy_pass http://127.0.0.1:5002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
