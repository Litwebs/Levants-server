name: One-time UAT Google provider verification
on:
  push:
    branches: [uat]
    paths: [.github/workflows/one-time-uat-google-repair.yml]
permissions:
  contents: read
jobs:
  verify:
    if: github.ref == 'refs/heads/uat' && contains(github.event.head_commit.message, '[verify-approved-uat-google-repair]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: uat
    steps:
      - name: Configure existing restricted UAT verification access
        env:
          UAT_SSH_KEY: ${{ secrets.UAT_SSH_KEY }}
          UAT_KNOWN_HOSTS: ${{ vars.UAT_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$UAT_SSH_KEY"
          test -n "$UAT_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$UAT_SSH_KEY" > ~/.ssh/uat
          chmod 600 ~/.ssh/uat
          printf '%s\n' "$UAT_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Verify the deployed immutable UAT release after the network repair
        env:
          UAT_HOST: ${{ vars.UAT_HOST }}
          UAT_PORT: ${{ vars.UAT_PORT }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/uat -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -p "$UAT_PORT" "levants-uat-deploy@$UAT_HOST" \
            "verify 1993566166b440cbe4172e97ac1d8bf1e50ab6bc" | tee uat-google-provider-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: approved-uat-google-provider-verification
          path: uat-google-provider-report.json
          if-no-files-found: error
          retention-days: 30
