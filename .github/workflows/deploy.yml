name: CI and deploy

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
  push:
    branches:
      - main

permissions:
  contents: read

# A new PR commit supersedes an older verification run. This prevents CI from
# burning time on obsolete feature-branch commits.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      - name: Run backend release suite
        working-directory: server
        run: npm run test:release

  client-quality:
    name: Client lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Lint and build the release client
        working-directory: client
        run: npm run check:release

  # The expensive real-Stripe/Playwright suite is deliberately a release gate,
  # not a per-commit development check. Keep a PR in Draft while iterating.
  # Mark it Ready for review only when the exact PR head is intended to ship.
  # Any later commit to a ready PR triggers this suite again automatically.
  subscription-e2e:
    name: Subscription E2E (Stripe test mode)
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    uses: ./.github/workflows/integration-e2e.yml
    secrets: inherit

  uat-verification:
    name: Exact release passed UAT
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require successful UAT tests for this code
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: python3 deployment/uat/promotion-gate.py

  production-release-gate:
    name: Production release gate
    if: always()
    needs:
      - backend-tests
      - client-quality
      - subscription-e2e
      - uat-verification
    runs-on: ubuntu-latest
    steps:
      - name: Require every release check to pass
        shell: bash
        env:
          BACKEND_RESULT: ${{ needs.backend-tests.result }}
          CLIENT_RESULT: ${{ needs.client-quality.result }}
          E2E_RESULT: ${{ needs.subscription-e2e.result }}
          UAT_RESULT: ${{ needs.uat-verification.result }}
        run: |
          set -euo pipefail
          [[ "$BACKEND_RESULT" == "success" ]]
          [[ "$CLIENT_RESULT" == "success" ]]
          [[ "$E2E_RESULT" == "success" ]]
          [[ "$UAT_RESULT" == "success" ]]

          echo "All production release checks passed for the current PR head."

  # Deploy only after the exact merged commit passes every release check.
  build-deploy-client:
    name: Build deployment client
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout merged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build deployment client
        working-directory: client
        run: npm run build

      - name: Store deployment client build
        uses: actions/upload-artifact@v4
        with:
          name: deployment-client-build
          path: client/build
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Deploy merged commit
    if: github.event_name == 'push'
    needs:
      - build-deploy-client
      - production-release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      REPO_DIR: ${{ github.event.repository.name }}

    steps:
      - name: Download deployment client build
        uses: actions/download-artifact@v4
        with:
          name: deployment-client-build
          path: client/build

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Trust VPS host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Restore stale generated admin build on VPS
        run: |
          ssh -p ${{ secrets.VPS_PORT }} root@${{ secrets.VPS_HOST }} \
            'repo_dir="/root/LWS-Scripts/${{ github.event.repository.name }}"; \
            if git -C "$repo_dir" ls-files --error-unmatch client/build/index.html > /dev/null 2>&1; then \
              git -C "$repo_dir" restore --source=HEAD --staged --worktree -- client/build; \
            fi'

      - name: Deploy backend
        run: |
          REPO_URL="https://github.com/${{ github.repository }}.git"
          ssh -p ${{ secrets.VPS_PORT }} root@${{ secrets.VPS_HOST }} \
            "cd /root/LWS-Scripts && export SKIP_CLIENT_BUILD=1 DEPLOY_SHA=${{ github.sha }} && ./05-auto-deploy.sh \"$REPO_URL\""

      - name: Verify the exact merged commit was deployed
        run: |
          REMOTE_SHA=$(ssh -p ${{ secrets.VPS_PORT }} root@${{ secrets.VPS_HOST }} "git -C /root/LWS-Scripts/${REPO_DIR} rev-parse HEAD")
          test "$REMOTE_SHA" = "${{ github.sha }}"

      - name: Prepare VPS build directory
        run: |
          ssh -p ${{ secrets.VPS_PORT }} root@${{ secrets.VPS_HOST }} \
            "rm -rf /root/LWS-Scripts/${REPO_DIR}/client/build && mkdir -p /root/LWS-Scripts/${REPO_DIR}/client/build"

      - name: Upload deployment client build
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: client/build
          target: /root/LWS-Scripts/${{ github.event.repository.name }}/client
          strip_components: 1
          overwrite: true
