name: Deals backend and storefront integration
on:
  push:
    branches: [feature/deals]
  pull_request:
    branches: [uat]
permissions:
  contents: read
concurrency:
  group: deals-regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    name: Select regression checks
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.paths.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          python3 - <<'PYTHON'
          import os, re, subprocess
          before = os.environ.get('BEFORE_SHA', '')
          backend = True
          if os.environ['EVENT_NAME'] == 'push' and re.fullmatch('[0-9a-f]{40}', before) and before != '0' * 40:
              paths = subprocess.check_output(['git', 'diff', '--name-only', before, 'HEAD'], text=True).splitlines()
              backend = any(not (path.startswith('server/IntegrationTests/Deals/') or path.startswith('docs/') or path == '.github/workflows/deals-regression.yml') for path in paths)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('backend=' + str(backend).lower() + '\n')
          PYTHON
  backend:
    name: Complete backend regression
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm run test:uat-safety
        working-directory: server
      - run: npm run test:release
        working-directory: server
  storefront:
    name: Real client to server package checkout
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Litwebs/Levants-client
          ref: 41d3b17b67b7b1621bdb43081b4330cb93b6d923
          path: client-storefront
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client-storefront/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: client-storefront
      - run: npm run build
        working-directory: client-storefront
        env:
          VITE_API_BASE_URL: /api
      - run: npx playwright install --with-deps chromium
        working-directory: server
      - run: npx jest --config IntegrationTests/Deals/jest.config.cjs --runInBand
        working-directory: server
        env:
          DEALS_CLIENT_DIST: ${{ github.workspace }}/client-storefront/dist
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: deals-client-server-failures
          path: server/deals-integration-artifacts/
  stripe-browser:
    name: Real Stripe test-mode browser checkout and refund
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEALS_REAL_STRIPE: "1"
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Litwebs/Levants-client
          ref: 41d3b17b67b7b1621bdb43081b4330cb93b6d923
          path: client-storefront
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client-storefront/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: client-storefront
      - run: npm run build
        working-directory: client-storefront
        env:
          VITE_API_BASE_URL: /api
      - run: npx playwright install --with-deps chromium
        working-directory: server
      - run: npx jest --config IntegrationTests/Deals/jest.config.cjs --runInBand --testNamePattern="Stripe test-mode hosted"
        working-directory: server
        env:
          DEALS_CLIENT_DIST: ${{ github.workspace }}/client-storefront/dist
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: deals-real-stripe-failures
          path: server/deals-integration-artifacts/
