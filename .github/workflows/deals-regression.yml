name: Deals regression

on:
  push:
    branches: [feature/deals]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deals-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend merge regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm run test:release
        working-directory: server

  admin:
    name: Admin deals and release checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm run check:release
        working-directory: client
