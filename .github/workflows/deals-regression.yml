name: Deals backend and storefront integration
on:
  push:
    branches: [feature/deals]
  pull_request:
    branches: [uat]
permissions:
  contents: read
concurrency:
  group: deals-regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    name: Complete backend regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm run test:uat-safety
        working-directory: server
      - run: npm run test:release
        working-directory: server
  storefront:
    name: Real client to server package checkout
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Litwebs/Levants-client
          ref: ca4889e5b813fddcb3e2548d640d217a52331ca2
          path: client-storefront
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client-storefront/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: client-storefront
      - run: npm run build
        working-directory: client-storefront
        env:
          VITE_API_BASE_URL: /api
      - run: npx playwright install --with-deps chromium
        working-directory: server
      - run: npx jest --config IntegrationTests/Deals/jest.config.cjs --runInBand
        working-directory: server
        env:
          DEALS_CLIENT_DIST: ${{ github.workspace }}/client-storefront/dist
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: deals-client-server-failures
          path: server/deals-integration-artifacts/
