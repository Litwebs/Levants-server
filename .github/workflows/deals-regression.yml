name: Deals backend, admin and storefront integration
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deals-regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  storefront:
    name: Real client to server package checkout
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Litwebs/Levants-client
          ref: 41d3b17b67b7b1621bdb43081b4330cb93b6d923
          path: client-storefront
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client-storefront/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: client-storefront
      - run: npm run build
        working-directory: client-storefront
        env:
          VITE_API_BASE_URL: /api
      - run: npx playwright install --with-deps chromium
        working-directory: server
      - run: npx jest --config IntegrationTests/Deals/jest.config.cjs --runInBand
        working-directory: server
        env:
          DEALS_CLIENT_DIST: ${{ github.workspace }}/client-storefront/dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deals-client-server-browser-evidence
          path: server/deals-integration-artifacts/
  stripe-browser:
    name: Real Stripe test-mode browser checkout and refund
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEALS_REAL_STRIPE: "1"
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Litwebs/Levants-client
          ref: 41d3b17b67b7b1621bdb43081b4330cb93b6d923
          path: client-storefront
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client-storefront/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: client-storefront
      - run: npm run build
        working-directory: client-storefront
        env:
          VITE_API_BASE_URL: /api
      - run: npx playwright install --with-deps chromium
        working-directory: server
      - run: npx jest --config IntegrationTests/Deals/jest.config.cjs --runInBand --testNamePattern="Stripe test-mode hosted"
        working-directory: server
        env:
          DEALS_CLIENT_DIST: ${{ github.workspace }}/client-storefront/dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deals-real-stripe-browser-evidence
          path: server/deals-integration-artifacts/

  admin:
    name: Admin Deals unit, build and desktop/mobile browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
      STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_TEST_PUBLISHABLE_KEY }}
      JWT_ACCESS_SECRET: ci-only-deals-access-secret
      JWT_REFRESH_SECRET: ci-only-deals-refresh-secret
      E2E_CLIENT_DIR: ${{ github.workspace }}/client-storefront
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: Litwebs/Levants-client
          ref: 41d3b17b67b7b1621bdb43081b4330cb93b6d923
          path: client-storefront
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
            client-storefront/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: client
      - run: npm ci
        working-directory: client-storefront
      - run: npm run test:deals
        working-directory: client
      - run: npm run test:deals-types
        working-directory: client
      - run: npx eslint src/pages/Deals src/context/Deals tests/deals.test.tsx tests/dealForm.test.ts tests/dealsApi.test.ts
        working-directory: client
      - run: npm run build
        working-directory: client
      - run: npx playwright install --with-deps chromium
        working-directory: server
      - run: npx playwright test --config playwright.deals.config.js --grep "admin"
        working-directory: server
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deals-admin-browser-evidence
          path: |
            server/test-results/playwright/
            server/playwright-report/
