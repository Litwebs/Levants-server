name: One-time approved UAT warehouse configuration
on:
  push:
    branches: [uat]
    paths: [.github/workflows/one-time-uat-warehouse.yml]
permissions:
  contents: read
jobs:
  configure:
    if: github.ref == 'refs/heads/uat' && contains(github.event.head_commit.message, '[approved-one-time-uat-warehouse]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Verify that only UAT settings and service can change
        run: python3 deployment/uat/test-set-uat-warehouse.py
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}
          log-public-key: false
      - name: Set only the two approved UAT warehouse coordinates
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -o BatchMode=yes -o ConnectTimeout=15 -p "$VPS_PORT" "root@$VPS_HOST" \
            'python3 - 53.811279 -1.775440' < deployment/uat/set-uat-warehouse.py | tee uat-warehouse-configuration-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: approved-uat-warehouse-${{ github.sha }}
          path: uat-warehouse-configuration-report.json
          if-no-files-found: error
          retention-days: 30
