name: Component Lab access check

on:
  push:
    branches:
      - feature/component-catalog

permissions:
  contents: read

jobs:
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install
        working-directory: client
        run: npm ci
      - name: Lint changed access files
        working-directory: client
        run: npx eslint src/App.tsx src/components/layout/AdminLayout.tsx src/components/auth/RequireLitwebsEmail.tsx src/lib/internalAccess.ts
      - name: Build
        working-directory: client
        run: npm run build
