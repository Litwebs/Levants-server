name: Delivery navigation verification
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Navigation unit and desktop/mobile browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: client
      - name: Navigation suite
        run: npm run test:delivery-navigation
        working-directory: server
      - run: npx playwright install --with-deps chromium
        working-directory: server
      - name: Desktop and mobile navigation selector
        run: npm run test:e2e:delivery-navigation
        working-directory: server
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: delivery-navigation-test-results
          path: server/test-results/delivery-navigation
