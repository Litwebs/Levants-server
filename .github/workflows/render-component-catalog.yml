name: Render component catalog screenshots

on:
  push:
    branches:
      - feature/component-catalog

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: client
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Create screenshot-only entry
        working-directory: client
        run: |
          cat > component-catalog-preview.html <<'EOF'
          <!doctype html>
          <html>
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>Levants Component Lab</title>
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="/src/component-catalog-screenshot.tsx"></script>
            </body>
          </html>
          EOF

          cat > src/component-catalog-screenshot.tsx <<'EOF'
          import React from "react";
          import ReactDOM from "react-dom/client";
          import { BrowserRouter } from "react-router-dom";
          import { ToastProvider } from "./components/common/Toast";
          import ComponentCatalog from "./pages/ComponentCatalog/ComponentCatalog";
          import "./styles/global.css";

          ReactDOM.createRoot(document.getElementById("root")!).render(
            <React.StrictMode>
              <ToastProvider>
                <BrowserRouter>
                  <ComponentCatalog />
                </BrowserRouter>
              </ToastProvider>
            </React.StrictMode>,
          );
          EOF

          cat > render-catalog.mjs <<'EOF'
          import { chromium } from "playwright";
          import fs from "node:fs";

          fs.mkdirSync("screenshots", { recursive: true });
          const browser = await chromium.launch({ headless: true });

          const desktop = await browser.newPage({ viewport: { width: 1440, height: 1100 }, deviceScaleFactor: 1 });
          await desktop.goto("http://127.0.0.1:4173/component-catalog-preview.html", { waitUntil: "networkidle" });
          await desktop.screenshot({ path: "screenshots/desktop-top.png", fullPage: false });
          await desktop.screenshot({ path: "screenshots/desktop-full.png", fullPage: true });

          const mobile = await browser.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1 });
          await mobile.goto("http://127.0.0.1:4173/component-catalog-preview.html", { waitUntil: "networkidle" });
          await mobile.screenshot({ path: "screenshots/mobile-top.png", fullPage: false });

          await browser.close();
          EOF

      - name: Start Vite and capture screenshots
        working-directory: client
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/levants-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill $VITE_PID || true' EXIT

          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4173/component-catalog-preview.html > /dev/null; then
              break
            fi
            sleep 1
          done

          node render-catalog.mjs

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: component-catalog-screenshots
          path: client/screenshots
          if-no-files-found: error
          retention-days: 1
