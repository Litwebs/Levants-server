name: Test suite organisation verification

on:
  push:
    branches: [fix/test]
    paths-ignore:
      - server/e2e/orders/**
      - server/playwright.orders.config.js
      - .github/workflows/orders-browser.yml
      - deployment/testing/orders-coverage.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-suites-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend API and unit tests
    uses: ./.github/workflows/backend-suites.yml
  admin:
    name: Admin frontend / Lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm run check:release
        working-directory: client
  browser:
    name: Browser automation
    uses: ./.github/workflows/integration-e2e.yml
    secrets: inherit
  navigation-browser:
    name: Navigation browser tests / Desktop and mobile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: client
      - run: npx playwright install --with-deps chromium
        working-directory: server
      - name: Desktop and mobile navigation selector
        run: npm run test:e2e:delivery-navigation
        working-directory: server
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: delivery-navigation-test-results
          path: server/test-results/delivery-navigation
  promotion-safety:
    name: Release safety / UAT promotion evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require complete browser results for promotion
        run: python3 deployment/uat/test-promotion-gate.py
