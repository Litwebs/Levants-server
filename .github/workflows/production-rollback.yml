name: Prepare compatible production rollback
on:
  push:
    branches: [uat]
    paths:
      - .github/workflows/production-rollback.yml
      - deployment/production/compatible-rollback.py
      - deployment/production/test-compatible-rollback.py
      - deployment/production/fixtures/auto-deploy.before-compatible.sh
permissions:
  contents: read
jobs:
  prepare:
    if: github.ref == 'refs/heads/uat'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies for offline schema validation
        working-directory: server
        run: npm ci
      - name: Verify Git isolation and automatic rollback using the exact helper fixture
        env:
          ROLLBACK_MODULE_ROOT: ${{ github.workspace }}
        run: python3 deployment/production/test-compatible-rollback.py
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}
          log-public-key: false
      - name: Rehearse the current VPS helper and install compatible rollback configuration
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -o BatchMode=yes -o ConnectTimeout=15 -p "$VPS_PORT" "root@$VPS_HOST" \
            'set -eu; umask 077; staged=$(mktemp /root/LWS-Scripts/.compatible-rollback.XXXXXX.py); trap '\''rm -f "$staged"'\'' EXIT; cat > "$staged"; python3 "$staged" install' \
            < deployment/production/compatible-rollback.py | tee compatible-rollback-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: production-compatible-rollback-${{ github.sha }}
          path: compatible-rollback-report.json
          retention-days: 30
          if-no-files-found: error
