name: Component catalog visual check

on:
  push:
    branches:
      - feature/component-catalog

permissions:
  contents: read

jobs:
  client-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install
        working-directory: client
        run: npm ci

      - name: Coverage
        working-directory: client
        run: npm run check:component-catalog

      - name: Lint
        working-directory: client
        run: npx eslint src/pages/ComponentCatalog src/App.tsx

      - name: Build
        working-directory: client
        run: npm run build
