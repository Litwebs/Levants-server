name: Verify and deploy isolated UAT

on:
  push:
    branches: [uat]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: levants-uat-deployment
  cancel-in-progress: false

jobs:
  subscription-e2e:
    name: Real Stripe and browser checks
    uses: ./.github/workflows/integration-e2e.yml
    secrets: inherit

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - name: Verify promotion evidence rules
        run: python3 deployment/uat/test-promotion-gate.py
      - name: Install backend dependencies
        run: npm ci
        working-directory: server
      - name: Verify UAT safety rules
        run: npm run test:uat-safety
        working-directory: server
      - name: Run backend release tests
        run: npm run test:release
        working-directory: server
      - name: Install admin dependencies
        run: npm ci
        working-directory: client
      - name: Verify and build admin
        run: npm run check:release
        working-directory: client
      - name: Package immutable UAT release
        run: python3 deployment/uat/package.py /tmp/levants-uat.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: uat-${{ github.sha }}
          path: /tmp/levants-uat.tar.gz
          retention-days: 14
          if-no-files-found: error

  deploy:
    needs: [verify, subscription-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: uat
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: uat-${{ github.sha }}
          path: release
      - name: Configure dedicated UAT SSH access
        env:
          UAT_SSH_KEY: ${{ secrets.UAT_SSH_KEY }}
          UAT_KNOWN_HOSTS: ${{ vars.UAT_KNOWN_HOSTS }}
        run: |
          test -n "$UAT_SSH_KEY"
          test -n "$UAT_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$UAT_SSH_KEY" > ~/.ssh/uat
          chmod 600 ~/.ssh/uat
          printf '%s\n' "$UAT_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Deploy to UAT only
        env:
          UAT_HOST: ${{ vars.UAT_HOST }}
          UAT_PORT: ${{ vars.UAT_PORT }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          test -n "$UAT_HOST"
          test -n "$UAT_PORT"
          ssh -i ~/.ssh/uat -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -p "$UAT_PORT" "levants-uat-deploy@$UAT_HOST" \
            "deploy $RELEASE_SHA" < release/levants-uat.tar.gz
      - name: Verify configured UAT providers
        env:
          UAT_HOST: ${{ vars.UAT_HOST }}
          UAT_PORT: ${{ vars.UAT_PORT }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/uat -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -p "$UAT_PORT" "levants-uat-deploy@$UAT_HOST" \
            "verify $RELEASE_SHA" | tee uat-integration-report.json
      - name: Save provider verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uat-provider-report-${{ github.sha }}
          path: uat-integration-report.json
          if-no-files-found: ignore
          retention-days: 14
