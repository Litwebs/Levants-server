name: Orders workflow verification

on:
  push:
    branches: [fix/test]
    paths:
      - server/e2e/orders/**
      - server/playwright.orders.config.js
      - .github/workflows/orders-browser.yml
      - deployment/testing/orders-coverage.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orders-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  orders:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - id: admin
            name: Orders browser / Admin lifecycle (desktop and mobile)
            specs: admin-orders.spec.js
          - id: guards
            name: Orders API / Permissions, validation and invariants
            specs: order-guards.spec.js order-invariants.spec.js
          - id: refunds
            name: Orders browser / Stripe refunds (desktop and mobile)
            specs: order-refunds.spec.js
    env:
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
      STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_TEST_PUBLISHABLE_KEY }}
      JWT_ACCESS_SECRET: ci-only-orders-access-secret
      JWT_REFRESH_SECRET: ci-only-orders-refresh-secret
      E2E_USE_STRIPE_CLI: '1'
      E2E_CAPTURE_EMAILS: '1'
      TZ: Europe/London
    steps:
      - uses: actions/checkout@v4
      - name: Require Stripe test-mode credentials
        run: |
          [[ "$STRIPE_SECRET_KEY" == sk_test_* ]]
          [[ "$STRIPE_PUBLISHABLE_KEY" == pk_test_* ]]
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - name: Install backend and test dependencies
        run: npm ci
        working-directory: server
      - name: Install real admin frontend dependencies
        run: npm ci
        working-directory: client
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: server
      - name: Install Stripe CLI
        run: |
          curl -s https://packages.stripe.dev/api/security/keypair/stripe-cli-gpg/public | gpg --dearmor | sudo tee /usr/share/keyrings/stripe.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/stripe.gpg] https://packages.stripe.dev/stripe-cli-debian-local stable main" | sudo tee /etc/apt/sources.list.d/stripe.list
          sudo apt-get update
          sudo apt-get install -y stripe
      - name: Record scope and inventory before running tests
        working-directory: server
        run: |
          echo "### ${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Server commit: $GITHUB_SHA. Actual order APIs; ephemeral MongoDB; Stripe test mode; captured email/storage." >> "$GITHUB_STEP_SUMMARY"
          npx playwright test --config playwright.orders.config.js ${{ matrix.specs }} --list
      - name: Run order workflow tests with strict assertions
        working-directory: server
        run: npx playwright test --config playwright.orders.config.js ${{ matrix.specs }}
      - name: Publish per-file test results
        if: always()
        run: |
          if test -f server/test-results/orders-report.json; then
            node server/scripts/test-suites.cjs summary server/test-results/orders-report.json '${{ matrix.name }}'
          fi
      - name: Save results and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orders-${{ matrix.id }}-results
          path: |
            server/test-results/orders-report.json
            server/test-results/orders
            server/playwright-report/orders
          if-no-files-found: ignore
          retention-days: 7
